name: Publish

on:
  release:
    types: [published]

env:
  ADDON_DIR: eufy-security-ws
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: eufy-security-ws

jobs:
  initialize:
    name: Initialize release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.cfg.outputs.version }}
      package_url: ${{ steps.cfg.outputs.package_url }}
      package_sha256: ${{ steps.cfg.outputs.package_sha256 }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Read release config
        id: cfg
        shell: bash
        run: |
          version="$(awk '/^version:/ {print $2; exit}' "$ADDON_DIR/config.yaml" | tr -d '\"')"
          package_url="$(awk '/EUFY_SECURITY_WS_PACKAGE_URL:/ {print $2; exit}' "$ADDON_DIR/build.yaml")"
          package_sha256="$(awk '/EUFY_SECURITY_WS_PACKAGE_SHA256:/ {print $2; exit}' "$ADDON_DIR/build.yaml")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match add-on version v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_url=$package_url" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: initialize
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Read base image
        id: base
        shell: bash
        run: |
          base="$(awk '/^[[:space:]]+${{ matrix.arch }}:/ {print $2; exit}' "$ADDON_DIR/build.yaml")"
          echo "image=$base" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: ${{ env.ADDON_DIR }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.initialize.outputs.version }}
            latest
          version: ${{ needs.initialize.outputs.version }}
          push: "true"
          cosign: "false"
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            EUFY_SECURITY_WS_PACKAGE_URL=${{ needs.initialize.outputs.package_url }}
            EUFY_SECURITY_WS_PACKAGE_SHA256=${{ needs.initialize.outputs.package_sha256 }}

  manifest:
    name: Publish multi-architecture manifest
    needs: [initialize, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.initialize.outputs.version }}
            latest
          cosign: "false"
